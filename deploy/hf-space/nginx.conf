worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;

  # maplibre-gl 5+ loads its tile worker as an ES module (.mjs). nginx's stock
  # mime.types has no .mjs entry, so it would be served as
  # application/octet-stream and the browser refuses to start the worker
  # ("Worker failed to load"). Serve it as JavaScript.
  types {
    text/javascript mjs;
  }
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  server {
    listen 7860;
    server_name _;

    # The app is built with VITE_BASE_PATH=/haze-watch/ so every asset URL is
    # already prefixed, and it is routed at evangoh.com/haze-watch (the route
    # pattern in deploy/cloudflare/wrangler.toml). This server therefore owns
    # the /haze-watch prefix: it strips it for the static files and for the API.

    # Canonical entry points.
    location = /haze-watch { return 301 /haze-watch/; }
    location = /          { return 302 /haze-watch/; }

    # API under the prefix: strip /haze-watch before uvicorn (which serves /api/v1).
    location /haze-watch/api/ {
      proxy_pass http://127.0.0.1:8000/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }

    # Bare /api/ kept working for direct calls and health checks.
    location /api/ {
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }

    # SPA: strip the prefix, serve the static build, fall back to index.html so
    # client-side routes (e.g. /haze-watch/map) deep-link correctly.
    #
    # The fallback must keep the /haze-watch prefix: try_files' last argument is
    # an internal redirect that goes back through location matching, and a bare
    # /index.html matches no location here (there is no server-level root).
    location /haze-watch/ {
      rewrite ^/haze-watch/(.*)$ /$1 break;
      root /app/frontend/dist;
      try_files $uri /haze-watch/index.html;
    }
  }
}
