name = "haze-watch-route"
main = "worker.js"
compatibility_date = "2026-10-01"

# Only requests under /haze-watch hit this Worker; everything else on the domain
# is served by the existing origin, untouched.
#
# www first: www.evangoh.com is the canonical host, and it is the one the site
# links to (APP_URL in the portfolio's HazeWatch.tsx). The apex evangoh.com
# returns a 522 on the Cloudflare->origin leg over HTTPS on every path (the
# origin route for the apex is broken; www reaches the same origin in ~0.3s),
# so the app must not be advertised at the bare apex. The apex route below is
# kept so /haze-watch also works there once that origin route is fixed; note
# that a scheme-matching apex->www Redirect Rule would shadow this Worker,
# because redirect rules run before Workers.
#
# The zone must already be on Cloudflare (evangoh.com is) and the hostnames
# proxied, which they are.
routes = [
  { pattern = "www.evangoh.com/haze-watch*", zone_name = "evangoh.com" },
  { pattern = "evangoh.com/haze-watch*", zone_name = "evangoh.com" },
  { pattern = "www.evangoh.com/api*", zone_name = "evangoh.com" },
  { pattern = "evangoh.com/api*", zone_name = "evangoh.com" }
]
