name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "frontend/**"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
      - run: npm ci
      # Production dependencies only: a dev-only advisory should not block a
      # release, but a high/critical one that ships must.
      - name: Dependency audit (production, fail on high+)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Guard the subpath build: the app is routed at evangoh.com/haze-watch,
      # and a broken base path only shows up when built with that prefix.
      - name: Build (subpath /haze-watch/)
        env:
          VITE_BASE_PATH: /haze-watch/
        run: npm run build
