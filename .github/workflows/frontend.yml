name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "frontend/**"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Guard the subpath build: the app is routed at evangoh.com/haze-watch,
      # and a broken base path only shows up when built with that prefix.
      - name: Build (subpath /haze-watch/)
        env:
          VITE_BASE_PATH: /haze-watch/
        run: npm run build
