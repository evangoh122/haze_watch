name: FIRMS history -> GeoParquet (HF)

on:
  schedule:
    # Daily at 02:17 UTC - keeps the rolling history fresh.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: "YYYY-MM-DD start of a historical backfill (empty = trailing window)"
        required: false
        default: ""
      backfill_days:
        description: "Days to fetch from --start-date (or trailing, when start_date is empty)"
        required: false
        default: "7"
      sensor:
        description: "FIRMS sensor: *_SP for history/archive quality (MODIS_SP, VIIRS_SNPP_SP, VIIRS_NOAA20_SP, VIIRS_NOAA21_SP) or *_NRT for recency (MODIS_NRT, VIIRS_SNPP_NRT, VIIRS_NOAA20_NRT, VIIRS_NOAA21_NRT). NRT sources only serve their retention window - use _SP for backfills."
        required: false
        default: "MODIS_NRT"

permissions:
  contents: read

# One lane at a time: all sensors share a single MAP_KEY, whose measured wall is
# ~500 requests / 10 min (observed 2026-10-16: four parallel lanes died inside
# the same 2 seconds at ~440 requests combined; a lone lane died at ~499 windows
# with "Exceeding allowed transaction limit.").
#
# Dispatch backfills ONE AT A TIME and wait for each to finish. GitHub holds at
# most one pending run per concurrency group and cancels the older waiting run
# when a newer one joins the group, so firing four together silently drops
# lanes - cancel-in-progress: false only protects the run already executing.
# The daily schedule run can likewise cancel a waiting backfill.
concurrency:
  group: firms-api
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # Free MAP_KEY: https://firms.modaps.eosdis.nasa.gov/api/map_key/
      HAZE_FIRMS_API_KEY: ${{ secrets.FIRMS_API_KEY }}
      # HF write token for egoh33/haze-watch-historical (GeoParquet history store)
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5

      - name: Check for required secrets
        id: key
        run: |
          if [ -z "${HAZE_FIRMS_API_KEY}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FIRMS_API_KEY secret is not set - skipping the sync."
          elif [ -z "${HF_TOKEN}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HF_TOKEN secret is not set - skipping the sync."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install workspace
        if: steps.key.outputs.present == 'true'
        run: uv sync --all-packages

      - name: Sync detections into HF history as GeoParquet
        if: steps.key.outputs.present == 'true'
        run: |
          uv run python scripts/sync_firms_history_to_hf.py \
            --sensor "${{ inputs.sensor || 'MODIS_NRT' }}" \
            --backfill-days "${{ inputs.backfill_days || '7' }}" \
            --start-date "${{ inputs.start_date || '' }}"

      - name: Upload the GeoParquet year files (debug artifact)
        if: steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: firms-history-geoparquet
          path: data/history_geo/
          if-no-files-found: error
          retention-days: 7
