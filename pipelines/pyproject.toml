[project]
name = "haze-pipelines"
version = "0.1.0"
description = "Batch ingestion and processing pipelines for the geospatial climate risk platform (research prototype)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=17.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "duckdb>=1.1",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.scripts]
haze-pipelines = "haze_pipelines.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/haze_pipelines"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
