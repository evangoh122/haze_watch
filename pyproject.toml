# Root of the uv workspace.
# Individual packages live in backend/ and pipelines/ and are installed editable.
[tool.uv.workspace]
members = ["backend", "pipelines"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # Used by private/ (hand-sourced company YAML) and its tests.
    "pyyaml>=6.0",
    # HF dataset history export/fetch (scripts/*_hf.py).
    "huggingface_hub>=0.26",
]
