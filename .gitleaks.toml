# gitleaks configuration - see https://github.com/gitleaks/gitleaks
# Extends the default ruleset; only adds allowlists for known-safe files.

[extend]
useDefault = true

[allowlist]
description = "Placeholder-only example files and documentation"
# Narrow value-level allowlists: paths stay scanned so a real pasted key is still caught.
regexes = [
  '''change-me''',
  '''sk-\.\.\.''',
  '''your[_-]?api[_-]?key''',
  '''sk-[A-Za-z0-9]{4}\.\.\.''',
]
paths = [
  '''\.env\.example$''',
]
